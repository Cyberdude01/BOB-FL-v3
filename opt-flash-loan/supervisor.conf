[program:flash-loan-arbitrum]
command=/opt/flash-loan/venv/bin/python /opt/flash-loan/scripts/live_flashloan_scanner.py --network arbitrum --execute
directory=/opt/flash-loan
autostart=false
autorestart=true
startretries=3
stderr_logfile=/var/log/flash-loan/supervisor-arbitrum.err.log
stdout_logfile=/var/log/flash-loan/supervisor-arbitrum.out.log
user=root

[program:flash-loan-base]
command=/opt/flash-loan/venv/bin/python /opt/flash-loan/scripts/live_flashloan_scanner.py --network base --execute
directory=/opt/flash-loan
autostart=false
autorestart=true
startretries=3
stderr_logfile=/var/log/flash-loan/supervisor-base.err.log
stdout_logfile=/var/log/flash-loan/supervisor-base.out.log
user=root

[program:flash-loan-monitor]
command=/opt/flash-loan/venv/bin/python /opt/flash-loan/scripts/continuous_flash_loan_campaign.py
directory=/opt/flash-loan
autostart=false
autorestart=true
startretries=3
stderr_logfile=/var/log/flash-loan/supervisor-monitor.err.log
stdout_logfile=/var/log/flash-loan/supervisor-monitor.out.log
user=root

[group:flash-loan]
programs=flash-loan-arbitrum,flash-loan-base,flash-loan-monitor